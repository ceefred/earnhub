<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarnHub Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f3f6fb;
  color: #172033;
}

.container {
  max-width: 900px;
  margin: 0 auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 24px;
}

h1 { margin: 0; font-size: 27px; }
h2 { font-size: 19px; }

.muted { color: #657085; overflow-wrap: anywhere; }

.card {
  background: white;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 18px;
  box-shadow: 0 3px 14px rgba(20, 35, 60, 0.06);
}

button, .button {
  display: inline-block;
  border: 0;
  border-radius: 8px;
  padding: 11px 15px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
}

.primary { background: #1769e0; color: white; }
.approve { background: #dcfce7; color: #166534; }
.reject { background: #fee2e2; color: #991b1b; }
.secondary { background: #e8edf5; color: #172033; }

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.reward {
  border-top: 1px solid #e6eaf0;
  padding: 16px 0;
}

.reward:first-of-type { border-top: 0; }

.reward p {
  margin: 8px 0;
  overflow-wrap: anywhere;
}

.status {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 20px;
  background: #eef2f7;
  font-size: 12px;
  font-weight: bold;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 12px;
}

#message {
  padding: 12px;
  border-radius: 8px;
  background: #e8edf5;
  margin-bottom: 16px;
  overflow-wrap: anywhere;
}

.hidden { display: none; }

@media (max-width: 480px) {
  body { padding: 14px; }
  h1 { font-size: 23px; }
  .card { padding: 16px; }
}

  </style>
</head>
<body>
  <main class="container">
    <header>
      <div>
        <h1>EarnHub Admin 🛡️</h1>
        <p class="muted">Reward management</p>
      </div>
      <button id="logoutButton" class="secondary hidden" type="button">
        Log out
      </button>
    </header><div id="message" role="status" aria-live="polite">
  Checking your account...
</div>

<section id="adminPanel" class="hidden">
  <div class="card">
    <h2>Administrator</h2>
    <p id="adminEmail" class="muted"></p>
    <p>Review pending rewards before approving or rejecting them.</p>
    <button id="refreshButton" class="primary" type="button">
      Refresh rewards
    </button>
  </div>

  <div class="card">
    <h2>Reward submissions</h2>
    <div id="rewardList">Loading rewards...</div>
  </div>
</section>

  </main>  <script>
    const SUPABASE_URL = "https://ncgijesgfoadjyshfoqv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_qRghUkUbwl_M6qAD3dGnTA_Oe1qaoHM";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const message = document.getElementById("message");
    const adminPanel = document.getElementById("adminPanel");
    const rewardList = document.getElementById("rewardList");
    const logoutButton = document.getElementById("logoutButton");
    const refreshButton = document.getElementById("refreshButton");

    function showMessage(text) {
      message.textContent = text;
    }

    function addTextElement(parent, tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = text;
      if (className) element.className = className;
      parent.appendChild(element);
      return element;
    }

    async function loadRewards() {
      rewardList.replaceChildren();
      addTextElement(rewardList, "p", "Loading rewards...", "muted");
      refreshButton.disabled = true;

      const { data, error } = await client
        .from("rewards")
        .select("id, user_id, amount, status, source, reference, created_at")
        .order("created_at", { ascending: false })
        .limit(100);

      refreshButton.disabled = false;
      rewardList.replaceChildren();

      if (error) {
        addTextElement(
          rewardList,
          "p",
          "Could not load rewards: " + error.message
        );
        return;
      }

      if (!data || data.length === 0) {
        addTextElement(
          rewardList,
          "p",
          "No reward submissions yet.",
          "muted"
        );
        return;
      }

      data.forEach((reward) => {
        const item = document.createElement("article");
        item.className = "reward";

        addTextElement(item, "p", "Amount: $" + Number(reward.amount).toFixed(2));
        addTextElement(item, "p", "Status: " + reward.status, "status");
        addTextElement(item, "p", "Source: " + (reward.source || "Unknown"));
        addTextElement(item, "p", "User ID: " + reward.user_id, "muted");
        addTextElement(item, "p", "Reward ID: " + reward.id, "muted");

        if (reward.reference) {
          addTextElement(item, "p", "Reference: " + reward.reference);
        }

        addTextElement(
          item,
          "p",
          "Submitted: " + new Date(reward.created_at).toLocaleString(),
          "muted"
        );

        if (reward.status === "pending") {
          const actions = document.createElement("div");
          actions.className = "actions";

          const approveButton = document.createElement("button");
          approveButton.type = "button";
          approveButton.className = "approve";
          approveButton.textContent = "Approve";

          const rejectButton = document.createElement("button");
          rejectButton.type = "button";
          rejectButton.className = "reject";
          rejectButton.textContent = "Reject";

          approveButton.addEventListener("click", () => {
            reviewReward(reward.id, "approved", approveButton, rejectButton);
          });

          rejectButton.addEventListener("click", () => {
            reviewReward(reward.id, "rejected", approveButton, rejectButton);
          });

          actions.append(approveButton, rejectButton);
          item.appendChild(actions);
        }

        rewardList.appendChild(item);
      });
    }

    async function reviewReward(rewardId, decision, approveButton, rejectButton) {
      const action = decision === "approved" ? "approve" : "reject";

      if (!confirm("Are you sure you want to " + action + " this reward?")) {
        return;
      }

      approveButton.disabled = true;
      rejectButton.disabled = true;
      showMessage("Processing reward review...");

      const { error } = await client.rpc("review_earnhub_reward", {
        p_reward_id: rewardId,
        p_decision: decision
      });

      if (error) {
        showMessage("Review failed: " + error.message);
        approveButton.disabled = false;
        rejectButton.disabled = false;
        return;
      }

      showMessage("Reward " + decision + " successfully.");
      await loadRewards();
    }

    async function initializeAdmin() {
      const { data, error } = await client.auth.getSession();

      if (error || !data.session) {
        window.location.replace("auth.html");
        return;
      }

      logoutButton.classList.remove("hidden");
      document.getElementById("adminEmail").textContent =
        data.session.user.email || "Signed-in user";

      const { data: isAdmin, error: adminError } = await client.rpc(
        "is_earnhub_admin"
      );

      if (adminError) {
        showMessage("Could not verify administrator access: " + adminError.message);
        return;
      }

      if (isAdmin !== true) {
        showMessage("Access denied. This account is not an EarnHub administrator.");
        return;
      }

      adminPanel.classList.remove("hidden");
      showMessage("Administrator access verified.");
      await loadRewards();
    }

    refreshButton.addEventListener("click", loadRewards);

    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;
      const { error } = await client.auth.signOut();

      if (error) {
        showMessage("Logout failed: " + error.message);
        logoutButton.disabled = false;
        return;
      }

      window.location.replace("auth.html");
    });
// EarnHub Admin User Management
const userSection = document.createElement("section");
userSection.className = "card";
userSection.innerHTML = `
  <h2>👥 Registered Users</h2>
  <p>View registered accounts and wallet balances.</p>
  <button type="button" id="refreshUsers">Refresh Users</button>
  <div id="registeredUsers">Loading registered users...</div>
`;
document.body.appendChild(userSection);

async function loadRegisteredUsers() {
  const container = document.getElementById("registeredUsers");
  container.textContent = "Loading registered users...";

  const { data, error } = await client.rpc("get_earnhub_admin_users");

  if (error) {
    container.textContent = "Could not load users: " + error.message;
    return;
  }

  container.replaceChildren();

  if (!data || data.length === 0) {
    container.textContent = "No registered users found.";
    return;
  }

  data.forEach((user) => {
    const item = document.createElement("div");
    item.style.cssText = "padding:16px 0;border-bottom:1px solid #ddd;";

    const username = document.createElement("h3");
    username.textContent = user.username
      ? "@" + user.username
      : "No username";

    const email = document.createElement("p");
    email.textContent = "Email: " + (user.email || "Not available");

    const available = document.createElement("p");
    available.textContent =
      "Available balance: $" + Number(user.available_balance).toFixed(2);

    const pending = document.createElement("p");
    pending.textContent =
      "Pending balance: $" + Number(user.pending_balance).toFixed(2);

    const joined = document.createElement("p");
    joined.textContent =
      "Joined: " + new Date(user.joined_at).toLocaleDateString();

    item.append(username, email, available, pending, joined);
    container.appendChild(item);
  });
}

document.getElementById("refreshUsers").addEventListener(
  "click",
  loadRegisteredUsers
);

loadRegisteredUsers();
    initializeAdmin();
    // EarnHub Withdrawal Management
const withdrawalSection = document.createElement("section");
withdrawalSection.className = "card";
withdrawalSection.innerHTML = `
  <h2>💸 Withdrawal Requests</h2>
  <p>Review and manage user withdrawals.</p>
  <button id="refreshWithdrawals">Refresh Withdrawals</button>
  <div id="withdrawalRequests">Loading withdrawals...</div>
`;

document.body.appendChild(withdrawalSection);

async function loadWithdrawals() {
  const container = document.getElementById("withdrawalRequests");
  container.textContent = "Loading withdrawals...";

  const { data, error } = await client
    .from("withdrawal_requests")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    container.textContent = "Could not load withdrawals: " + error.message;
    return;
  }

  container.replaceChildren();

  if (!data || data.length === 0) {
    container.textContent = "No withdrawal requests yet.";
    return;
  }

  data.forEach((request) => {
    const item = document.createElement("div");
    item.style.cssText = "padding:16px 0;border-bottom:1px solid #ddd;";

    const details = document.createElement("p");
    details.textContent =
      "Amount: $" + Number(request.amount).toFixed(2) +
      " | Status: " + request.status +
      " | Method: " + request.payment_method +
      " | User: " + request.user_id;

    const payment = document.createElement("p");
    payment.textContent = "Payment details: " + request.payment_details;

    const id = document.createElement("small");
    id.textContent = "Request ID: " + request.id;

    item.append(details, payment, id);

    if (request.status === "pending") {
      item.appendChild(
        makeWithdrawalButton(request.id, "approved", "Approve")
      );
      item.appendChild(
        makeWithdrawalButton(request.id, "rejected", "Reject")
      );
    } else if (request.status === "approved") {
      item.appendChild(
        makeWithdrawalButton(request.id, "paid", "Mark as Paid")
      );
    }

    container.appendChild(item);
  });
}

function makeWithdrawalButton(requestId, decision, label) {
  const button = document.createElement("button");
  button.textContent = label;
  button.style.marginRight = "8px";

  button.addEventListener("click", async () => {
    if (
      decision === "paid" &&
      !confirm("Have you actually sent this payment?")
    ) {
      return;
    }

    if (!confirm("Are you sure you want to " + decision + " this withdrawal?")) {
      return;
    }

    button.disabled = true;

    const { error } = await client.rpc("review_earnhub_withdrawal", {
      p_request_id: requestId,
      p_decision: decision
    });

    if (error) {
      alert("Withdrawal update failed: " + error.message);
      button.disabled = false;
      return;
    }

    alert("Withdrawal updated successfully.");
    loadWithdrawals();
  });

  return button;
}

document
  .getElementById("refreshWithdrawals")
  .addEventListener("click", loadWithdrawals);

loadWithdrawals();
    // EarnHub Simple Task Management
const taskSection = document.createElement("section");
taskSection.className = "card";
taskSection.innerHTML = `
  <h2>📝 Create Simple Tasks</h2>
  <p>Create tasks for registered users to complete.</p>

  <form id="createTaskForm">
    <p>
      <label for="taskTitle">Task title</label><br>
      <input id="taskTitle" required maxlength="120"
        style="width:100%;padding:10px;margin-top:5px;">
    </p>

    <p>
      <label for="taskDescription">Short description</label><br>
      <textarea id="taskDescription" required maxlength="500"
        style="width:100%;padding:10px;margin-top:5px;"></textarea>
    </p>

    <p>
      <label for="taskInstructions">Task instructions</label><br>
      <textarea id="taskInstructions" required maxlength="2000"
        style="width:100%;padding:10px;margin-top:5px;"></textarea>
    </p>

    <p>
      <label for="taskReward">Reward amount (USD)</label><br>
      <input id="taskReward" type="number" min="0.01"
        max="1000" step="0.01" required
        style="width:100%;padding:10px;margin-top:5px;">
    </p>

    <button type="submit" class="primary">Create Task</button>
  </form>

  <p id="taskMessage" role="status"></p>

  <hr style="margin:24px 0;">

  <h2>📋 Existing Tasks</h2>
  <button type="button" id="refreshTasks" class="secondary">
    Refresh Tasks
  </button>
  <div id="adminTaskList">Loading tasks...</div>

  <hr style="margin:24px 0;">

  <h2>📨 Task Submissions</h2>
  <button type="button" id="refreshSubmissions" class="secondary">
    Refresh Submissions
  </button>
  <div id="adminSubmissionList">Loading submissions...</div>
`;

document.querySelector("main.container").appendChild(taskSection);

const createTaskForm = document.getElementById("createTaskForm");
const taskMessage = document.getElementById("taskMessage");
const adminTaskList = document.getElementById("adminTaskList");
const adminSubmissionList = document.getElementById("adminSubmissionList");

createTaskForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const title = document.getElementById("taskTitle").value.trim();
  const description = document.getElementById("taskDescription").value.trim();
  const instructions = document.getElementById("taskInstructions").value.trim();
  const reward = Number(document.getElementById("taskReward").value);

  if (!title || !description || !instructions ||
      !Number.isFinite(reward) || reward <= 0 || reward > 1000) {
    taskMessage.textContent = "Please enter valid task details and a reward between $0.01 and $1,000.";
    return;
  }

  const submitButton = createTaskForm.querySelector('button[type="submit"]');
  submitButton.disabled = true;
  taskMessage.textContent = "Creating task...";

  const { error } = await client.from("tasks").insert({
    title,
    description,
    instructions,
    reward_amount: reward,
    is_active: true
  });

  submitButton.disabled = false;

  if (error) {
    taskMessage.textContent = "Task creation failed: " + error.message;
    return;
  }

  taskMessage.textContent = "Task created successfully.";
  createTaskForm.reset();
  await loadAdminTasks();
});

async function loadAdminTasks() {
  adminTaskList.textContent = "Loading tasks...";

  const { data, error } = await client
    .from("tasks")
    .select("id,title,description,reward_amount,is_active,created_at")
    .order("created_at", { ascending: false });

  if (error) {
    adminTaskList.textContent = "Could not load tasks: " + error.message;
    return;
  }

  adminTaskList.replaceChildren();

  if (!data || data.length === 0) {
    adminTaskList.textContent = "No tasks created yet.";
    return;
  }

  data.forEach((task) => {
    const item = document.createElement("div");
    item.style.cssText = "padding:14px 0;border-bottom:1px solid #ddd;";

    const title = document.createElement("h3");
    title.textContent = task.title;

    const description = document.createElement("p");
    description.textContent = task.description;

    const reward = document.createElement("p");
    reward.textContent = "Reward: $" + Number(task.reward_amount).toFixed(2);

    const status = document.createElement("p");
    status.textContent = "Status: " + (task.is_active ? "Active" : "Inactive");

    item.append(title, description, reward, status);

    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "secondary";
    toggle.textContent = task.is_active ? "Deactivate Task" : "Activate Task";

    toggle.addEventListener("click", async () => {
      toggle.disabled = true;

      const { error: updateError } = await client
        .from("tasks")
        .update({ is_active: !task.is_active })
        .eq("id", task.id);

      if (updateError) {
        alert("Task update failed: " + updateError.message);
        toggle.disabled = false;
        return;
      }

      await loadAdminTasks();
    });

    item.appendChild(toggle);
    adminTaskList.appendChild(item);
  });
}

async function loadAdminSubmissions() {
  adminSubmissionList.textContent = "Loading submissions...";

  const { data, error } = await client
    .from("task_submissions")
    .select("id,task_id,user_id,proof,status,admin_notes,created_at")
    .order("created_at", { ascending: false });

  if (error) {
    adminSubmissionList.textContent =
      "Could not load submissions: " + error.message;
    return;
  }

  adminSubmissionList.replaceChildren();

  if (!data || data.length === 0) {
    adminSubmissionList.textContent = "No task submissions yet.";
    return;
  }

  data.forEach((submission) => {
    const item = document.createElement("div");
    item.style.cssText = "padding:14px 0;border-bottom:1px solid #ddd;";

    const status = document.createElement("p");
    status.textContent = "Status: " + submission.status;

    const user = document.createElement("p");
    user.textContent = "User ID: " + submission.user_id;

    const task = document.createElement("p");
    task.textContent = "Task ID: " + submission.task_id;

    const proof = document.createElement("p");
    proof.textContent = "Proof: " + submission.proof;

    const date = document.createElement("p");
    date.textContent = "Submitted: " +
      new Date(submission.created_at).toLocaleString();

    item.append(status, user, task, proof, date);

    if (submission.admin_notes) {
      const notes = document.createElement("p");
      notes.textContent = "Admin notes: " + submission.admin_notes;
      item.appendChild(notes);
    }

    if (submission.status === "pending") {
      const notesInput = document.createElement("textarea");
      notesInput.maxLength = 1000;
      notesInput.placeholder = "Optional review note";
      notesInput.setAttribute("aria-label", "Review note");
      notesInput.style.cssText = "width:100%;padding:10px;margin:8px 0;";

      const actions = document.createElement("div");
      actions.className = "actions";

      ["approved", "rejected"].forEach((decision) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = decision === "approved" ? "approve" : "reject";
        button.textContent = decision === "approved" ? "Approve Submission" : "Reject Submission";

        button.addEventListener("click", async () => {
          if (!confirm("Are you sure you want to " + decision + " this submission?")) {
            return;
          }

          button.disabled = true;

          const { error: reviewError } = await client.rpc(
            "review_earnhub_task_submission",
            {
              p_submission_id: submission.id,
              p_decision: decision,
              p_admin_notes: notesInput.value.trim() || null
            }
          );

          if (reviewError) {
            alert("Review failed: " + reviewError.message);
            button.disabled = false;
            return;
          }

          alert("Submission " + decision + ". If approved, its reward enters the pending reward review process.");
          await loadAdminSubmissions();
        });

        actions.appendChild(button);
      });

      item.append(notesInput, actions);
    }

    adminSubmissionList.appendChild(item);
  });
}

document.getElementById("refreshTasks").addEventListener("click", loadAdminTasks);
document.getElementById("refreshSubmissions").addEventListener("click", loadAdminSubmissions);

loadAdminTasks();
loadAdminSubmissions();
  </script></body>
